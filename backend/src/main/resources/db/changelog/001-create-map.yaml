databaseChangeLog:
  - changeSet:
      id: 001-create-map
      author: fleetlab
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE TABLE navigation_map (
                id UUID PRIMARY KEY,
                name VARCHAR(100) NOT NULL,
                CONSTRAINT ck_navigation_map_name CHECK (char_length(btrim(name)) BETWEEN 1 AND 100)
              );
              CREATE TABLE navigation_node (
                id UUID PRIMARY KEY,
                map_id UUID NOT NULL REFERENCES navigation_map(id),
                x_meters DOUBLE PRECISION NOT NULL,
                y_meters DOUBLE PRECISION NOT NULL,
                CONSTRAINT uq_navigation_node_map_id UNIQUE (map_id, id),
                CONSTRAINT ck_navigation_node_x CHECK (x_meters > '-Infinity'::float8 AND x_meters < 'Infinity'::float8),
                CONSTRAINT ck_navigation_node_y CHECK (y_meters > '-Infinity'::float8 AND y_meters < 'Infinity'::float8)
              );
              CREATE TABLE navigation_edge (
                id UUID PRIMARY KEY,
                map_id UUID NOT NULL REFERENCES navigation_map(id),
                from_node_id UUID NOT NULL,
                to_node_id UUID NOT NULL,
                distance_meters DOUBLE PRECISION NOT NULL,
                CONSTRAINT fk_navigation_edge_from FOREIGN KEY (map_id, from_node_id)
                  REFERENCES navigation_node(map_id, id),
                CONSTRAINT fk_navigation_edge_to FOREIGN KEY (map_id, to_node_id)
                  REFERENCES navigation_node(map_id, id),
                CONSTRAINT ck_navigation_edge_endpoints CHECK (from_node_id <> to_node_id),
                CONSTRAINT ck_navigation_edge_distance CHECK (distance_meters > 0 AND distance_meters < 'Infinity'::float8)
              );
              CREATE INDEX ix_navigation_edge_from ON navigation_edge(map_id, from_node_id);
              CREATE INDEX ix_navigation_edge_to ON navigation_edge(map_id, to_node_id);
